name: kelime_hatiratici
description: Windows için Kelime Hatırlatıcı Uygulaması
publish_to: 'none'
version: 2.8.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  window_manager: ^0.3.9
  system_tray: ^2.0.3
  desktop_multi_window: ^0.2.0
  screen_retriever: ^0.1.9   # ← YENİ: monitörleri doğru ölçer
  win32: ^5.5.4
  ffi: ^2.1.2
  sqflite_common_ffi: ^2.3.3
  local_notifier: ^0.1.5
  shared_preferences: ^2.2.3
  path: ^1.9.0
  file_picker: ^8.0.6
  csv: ^6.0.0
  launch_at_startup: ^0.3.1
  package_info_plus: ^6.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.ico